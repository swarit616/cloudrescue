global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloudrescue
    metrics_path: /metrics
    static_configs:
      # "cloudrescue" is the Compose service name; 8000 is the container port.
      - targets: ["cloudrescue:8000"]

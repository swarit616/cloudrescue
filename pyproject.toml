[project]
name = "cloudrescue"
version = "0.1.0"
description = "Local incident/recovery simulation with Prometheus metrics, ready for a later AWS phase"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501", # line length is handled by `ruff format`
    "B008", # FastAPI Depends/Query defaults are idiomatic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
